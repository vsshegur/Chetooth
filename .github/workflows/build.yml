# Chetooth: tests, then a signed APK published as a GitHub release on every push to main.
# Latest APK: https://github.com/vsshegur/Chetooth/releases/latest/download/chetooth.apk
#
# Signing uses signing/chetooth.jks from the repo so every build installs over the previous one.
# It is a personal hobby key (public repo): move it to a repository secret if that ever matters.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KOTLIN_VERSION: "2.4.21"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Kotlin compiler
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlinc.zip" \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          unzip -q "$RUNNER_TEMP/kotlinc.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
          echo "KOTLIN_LIB=$RUNNER_TEMP/kotlinc/lib" >> "$GITHUB_ENV"

      - name: Install Android build-tools 36 and platform 36
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)/sdkmanager
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_SDK=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Host tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          bash test.sh 2>&1 | tee tests.log
      - name: Report test failures
        if: steps.tests.outcome == 'failure'
        run: |
          grep -E "error:|Exception|FAILED|Check failed" tests.log | head -40 | while IFS= read -r line; do echo "::warning title=Test::$line"; done

      - name: Build signed APK
        env:
          RUTA_KEYSTORE: signing/chetooth.jks
          RUTA_KEY_ALIAS: chetooth
          RUTA_KEYSTORE_PASS: chetooth-key
        run: |
          set -o pipefail
          if ! bash build.sh 2>&1 | tee build.log; then
            grep -E "error:|^e: |FAILED|fail" build.log | head -60 | while IFS= read -r line; do echo "::error title=Build::$line"; done
            exit 1
          fi
          cp dist/chetooth-*.apk chetooth.apk

      - uses: actions/upload-artifact@v4
        with:
          name: chetooth
          path: chetooth.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Chetooth build ${{ github.run_number }}
          body: |
            Install **chetooth.apk** on your Android phone (allow installs from your browser when asked).
            Built from ${{ github.sha }}.
          files: chetooth.apk
          make_latest: true
